name: Sync plumbing dataset

on:
  push:
    paths-ignore:
      - 'plumbing/**'
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from check catalog
        run: node scripts/sync-plumbing.mjs

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json plumbing/
          if git diff --cached --quiet; then
            echo 'No dataset changes.'
            exit 0
          fi
          git commit -m 'chore: sync plumbing dataset'
          git push
