name: Validate datasets

on:
  push:
    paths:
      - 'index.json'
      - 'schema/**'
      - 'plumbing/**'
      - 'electrical/**'
      - 'scripts/**'
      - '.github/workflows/sync-plumbing.yml'
  pull_request:
    paths:
      - 'index.json'
      - 'schema/**'
      - 'plumbing/**'
      - 'electrical/**'
      - 'scripts/**'
      - '.github/workflows/sync-plumbing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dataset
        run: node scripts/validate-dataset.mjs
